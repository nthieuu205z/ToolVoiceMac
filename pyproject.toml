[project]
name = "toolvietsub"
version = "0.1.0"
description = "Lồng tiếng & phụ đề tiếng Việt cho video, chạy cục bộ trên máy"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "srt>=3.5",
    "numpy>=1.26",
    "tenacity>=9.0",
    # Nhận diện giọng nói chạy trên máy — miễn phí, không hạn mức.
    "faster-whisper>=1.0",
    # Giọng đọc tiếng Việt miễn phí, không cần API key.
    "edge-tts>=7.0",
]

[project.optional-dependencies]
omnivoice = [
    "omnivoice>=0.2.1",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "accelerate>=1.1",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["backend", "pipeline"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
