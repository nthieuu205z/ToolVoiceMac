[project]
name = "toolvoicemac"
version = "0.2.0"
description = "Local voice cloning, text-to-speech projects and video dubbing for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = ["Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3.12"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "google-genai==2.20.0",
    "srt==3.5.3",
    "numpy==2.5.2",
    "tenacity==9.1.4",
    "faster-whisper==1.2.1",
    "edge-tts==7.2.8",
    "omnivoice==0.2.1",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers==5.16.1",
    "accelerate==1.14.0",
    "soundfile==0.14.0",
]

[project.urls]
Repository = "https://github.com/nthieuu205z/ToolVoiceMac"

[project.scripts]
toolvoice = "toolvoice.cli:main"

[project.optional-dependencies]
omnivoice = []
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["provider_smoke: opt-in calls to real network/local model providers"]

[tool.setuptools.packages.find]
include = ["toolvoice*", "backend*", "pipeline*", "web"]

[tool.setuptools.package-data]
web = ["static/*.html", "static/*.css", "static/*.js", "static/fonts/*", "static/images/*"]

[tool.setuptools.exclude-package-data]
web = ["static/previews/*", "static/previews/**/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
